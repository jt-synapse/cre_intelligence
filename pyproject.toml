[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cre-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn>=0.32,<1",
  "sqlalchemy>=2.0.36,<2.2",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
  "boto3>=1.35,<2",
  "pillow>=10,<14",
  "openpyxl>=3.1.5,<4",
  "reportlab>=4.2,<6",
  "python-multipart>=0.0.22,<1",
  "pypdf>=6.1,<8",
  "httpx>=0.28,<0.29",
  "defusedxml>=0.7,<1",
  "ijson>=3.4,<4",
]
[project.optional-dependencies]
test = ["pytest>=8.3,<10"]
[tool.setuptools.packages.find]
include = ["cre*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a migrated PostGIS database"]

[tool.setuptools.package-data]
"cre.ingestion" = ["*.sql"]
