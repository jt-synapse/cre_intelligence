# Loopback-only S3 API emulator for automated adapter tests.
name: cre-object-test
services:
  object-test:
    image: motoserver/moto:5.1.11
    environment:
      MOTO_S3_ALLOW_CROSSACCOUNT_ACCESS: "false"
    ports: ["127.0.0.1:59009:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 20
