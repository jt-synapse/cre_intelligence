name: cre-intelligence
services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: cre
      POSTGRES_USER: cre_owner
      POSTGRES_PASSWORD: local-owner
    ports: ["127.0.0.1:55439:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/local-roles.sql:/docker-entrypoint-initdb.d/99-local-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cre_owner -d cre"]
      interval: 3s
      timeout: 3s
      retries: 25
volumes:
  pgdata:

